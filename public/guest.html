<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1f33">
  <title>Menyu</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --navy: #0b1f33; --blue: #2156e8; --blue-soft: #e8eefd; --bg: #f4f5f8; --card: #fff; --line: #e3e6ec; --text: #0f172a; --muted: #64748b;
      --green: #15803d; --green-soft: #dcfce7; --red: #b91c1c; --red-soft: #fee2e2; --orange: #b45309; --orange-soft: #fef3c7; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 16px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }
    header.top { background: var(--navy); color: #fff; padding: 16px 0 18px; }
    header.top .wrap { display: grid; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 46px; height: 46px; border-radius: 12px; object-fit: contain; background: #fff; }
    .brand h1 { font-size: 20px; margin: 0; line-height: 1.2; }
    .brand .grow { flex: 1; min-width: 0; }
    .lang { display: flex; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; overflow: hidden; flex: none; }
    .lang button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 6px 9px; font-size: 13px; font-weight: 700; }
    .lang button.on { background: #fff; color: var(--navy); }
    .room { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 17px; justify-self: start; }
    .who { font-size: 14px; color: rgba(255,255,255,.75); display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .who b { color: #fff; font-weight: 600; }
    .notice { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--orange-soft); color: var(--orange); font-size: 14px; font-weight: 600; }
    .cats { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cats .wrap { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .cats .wrap::-webkit-scrollbar { display: none; }
    .cats button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .cats button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .search { width: 100%; margin: 12px 0 4px; padding: 12px 14px; font: inherit; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    h2.cat { font-size: 19px; margin: 22px 0 10px; scroll-margin-top: 70px; }
    .dish { display: grid; grid-template-columns: 96px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
    .dish .ph { width: 96px; height: 96px; border-radius: 12px; background: var(--bg) center/cover no-repeat; display: grid; place-items: center; font-size: 40px; overflow: hidden; }
    .dish .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dish b { display: block; font-size: 16px; line-height: 1.3; }
    .dish p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dish .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .dish .price { font-weight: 800; font-size: 16px; white-space: nowrap; }
    .dish .eta { font-size: 12.5px; color: var(--muted); display: block; margin-top: 2px; }
    .grow { flex: 1; }
    .step { display: inline-flex; align-items: center; background: var(--blue-soft); border-radius: 12px; overflow: hidden; }
    .step button { border: 0; background: none; width: 38px; height: 38px; font-size: 22px; font-weight: 700; color: var(--blue); }
    .step span { min-width: 22px; text-align: center; font-weight: 800; color: var(--blue); }
    .add { border: 0; background: var(--blue); color: #fff; border-radius: 12px; height: 38px; padding: 0 16px; font-weight: 700; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(244,245,248,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
    .bar .wrap { display: flex; gap: 8px; padding: 0; }
    .btn { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn:disabled { opacity: .6; }
    .bar .cart { flex: 1; justify-content: space-between; }
    .bar .cart .n { background: rgba(255,255,255,.22); border-radius: 8px; padding: 1px 8px; }
    .bar .small { padding: 12px; flex-direction: column; gap: 2px; font-size: 11.5px; min-width: 70px; }
    .sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: var(--card); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin: 0 0 12px; font-size: 20px; display: flex; align-items: center; }
    .sheet h3 .x { margin-left: auto; border: 0; background: var(--bg); border-radius: 10px; width: 36px; height: 36px; font-size: 20px; }
    .line { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
    .line input { grid-column: 1 / -1; width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
    .sum { display: grid; grid-template-columns: 1fr auto; gap: 4px; margin: 12px 0; font-size: 15px; }
    .sum .total { font-size: 20px; font-weight: 800; }
    textarea { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; resize: vertical; }
    .hint { font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
    .sheet .btn { width: 100%; padding: 15px; font-size: 17px; }
    .req { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 12px 0 0; }
    .req .st { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
    .st.pending { background: var(--orange-soft); color: var(--orange); } .st.approved, .st.done { background: var(--green-soft); color: var(--green); }
    .st.rejected, .st.expired { background: var(--red-soft); color: var(--red); }
    .req ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 28px); text-align: center; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .foot { text-align: center; color: var(--muted); font-size: 12.5px; margin: 28px 0 0; }
    .foot a { color: inherit; }
  </style>
</head>
<body>
  <div id="app"><div class="empty">…</div></div>
  <script src="/js/guest.js"></script>
</body>
</html>

<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ofitsantlik testi — FLOWI Akademiya</title>
<meta name="description" content="Ofitsantlik va xizmat madaniyati bo'yicha bepul onlayn test: 20 ta savol, darhol natija va sertifikat. FLOWI Akademiya.">
<meta property="og:title" content="Ofitsantlik testi — FLOWI Akademiya">
<meta property="og:description" content="20 ta savol, darhol natija va sertifikat. Bilimingizni sinab ko'ring!">
<meta property="og:image" content="/landing/og.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --p: #2156e8; --d: #0f2130; --t: #0f172a; --m: #5b6472; --l: #dfe3ea; --bg: #f4f6f9; --g: #16a34a; --gs: #e6f6ec; --r: #dc2626; --rs: #fdecec; --o: #fff4e2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--t); background: var(--bg); }
  a { color: var(--p); }
  header { background: var(--d); color: #fff; }
  .top { max-width: 720px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 900; letter-spacing: 2px; font-size: 20px; color: #fff; text-decoration: none; } .logo span { color: #6f9bff; }
  .top small { opacity: .75; }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }
  .card { background: #fff; border: 1px solid var(--l); border-radius: 18px; padding: 20px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; } h2 { font-size: 20px; margin: 0 0 8px; }
  .muted { color: var(--m); } .small { font-size: 14px; }
  .hero { text-align: center; } .hero .big { font-size: 64px; line-height: 1.1; }
  .facts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .facts span { background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  label { display: block; text-align: left; font-weight: 600; font-size: 14px; margin-top: 12px; }
  input { width: 100%; font: inherit; padding: 13px 14px; border: 1.5px solid var(--l); border-radius: 12px; margin-top: 5px; background: #fff; color: var(--t); }
  input:focus { outline: none; border-color: var(--p); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; padding: 14px 18px; border-radius: 12px; border: 1.5px solid var(--l); background: #fff; color: var(--t); cursor: pointer; text-decoration: none; min-height: 52px; }
  .btn.p { background: var(--p); border-color: var(--p); color: #fff; } .btn.g { background: var(--g); border-color: var(--g); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; } .block { width: 100%; }
  .row { display: flex; gap: 10px; margin-top: 14px; } .row .btn { flex: 1; }
  .bar { height: 8px; background: #e6e9ed; border-radius: 9px; overflow: hidden; margin: 8px 0 16px; } .bar i { display: block; height: 100%; background: var(--p); transition: width .25s; }
  .qn { color: var(--m); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .q { font-size: 19px; font-weight: 750; line-height: 1.4; margin: 4px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; background: #fff; border: 2px solid var(--l); border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; cursor: pointer; color: var(--t); line-height: 1.4; }
  .opt b { color: var(--m); margin-right: 4px; } .opt.sel { border-color: var(--p); background: #e6edfd; }
  .score { font-size: 54px; font-weight: 850; } .ok { color: var(--g); } .bad { color: var(--r); }
  .rev { border: 1px solid var(--l); border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: #fff; }
  .do, .dont { border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 15px; } .do { background: var(--gs); } .dont { background: var(--rs); }
  .why { font-size: 14px; color: var(--m); margin-top: 6px; }
  .cta { margin-top: 16px; background: var(--d); color: #fff; border-radius: 18px; padding: 18px 20px; }
  .cta b { font-size: 18px; } .cta p { margin: 6px 0 12px; opacity: .85; } .cta .btn { background: #fff; color: var(--d); border-color: #fff; }
  .err { background: var(--rs); color: var(--r); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; display: none; }
  .hp { position: absolute; left: -9999px; }
  .lrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--l); text-decoration: none; color: var(--t); font-size: 15px; text-align: left; }
  .vs { display: flex; justify-content: space-around; align-items: flex-start; gap: 8px; } .vs > div { flex: 1; display: grid; justify-items: center; font-size: 26px; }
  .vs b { font-size: 16px; } .vs .big { font-size: 44px; font-weight: 900; line-height: 1.1; } .vs .w .big { color: var(--g); } .vs small { font-size: 13px; color: var(--m); }
  .vs > i { font-style: normal; font-weight: 900; color: #c9a227; font-size: 22px; align-self: center; }
  footer { text-align: center; color: var(--m); font-size: 13px; padding: 10px 16px 30px; }
  @media (max-width: 480px) { h1 { font-size: 22px; } .card { padding: 16px; } .q { font-size: 17px; } }
</style>
</head>
<body>
<header><div class="top"><a class="logo" href="/">FLOW<span>I</span></a><small>Akademiya</small></div></header>
<main id="app"></main>
<script src="/js/qrcode.js"></script>
<footer>© FLOWI · <a href="/">flowi.uz</a> — choyxona, restoran va do'konlar uchun dastur</footer>
<script>
'use strict';
var S = { key: '', questions: [], i: 0, answers: {}, result: null, name: '', place: '', phone: '', attempt: 1 };
var app = document.getElementById('app');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtDate(ts) { var d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
function api(method, path, body) {
  return fetch(path, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.error) || 'Xatolik'); return j; }); });
}
function showErr(msg) { var e = document.getElementById('err'); if (e) { e.textContent = msg; e.style.display = 'block'; } else alert(msg); }

function intro() {
  app.innerHTML = '<div class="card hero"><div class="big">🎓</div><h1>Ofitsantlik va xizmat madaniyati testi</h1>' +
    '<p class="muted">Mehmonni kutib olish, dasturxon va choy odobi, muloqot, shikoyat bilan ishlash, gigiena va hisob-kitob bo\'yicha bilimingizni sinab ko\'ring.</p>' +
    '<div class="facts"><span>📝 20 ta savol</span><span>⏱ ~10 daqiqa</span><span>✅ 70% — o\'tdi</span><span>🏅 Sertifikat</span></div>' +
    '<form id="f" autocomplete="on"><label>Ismingiz va familiyangiz<input name="name" required maxlength="60" placeholder="Masalan: Jasur Aliyev" value="' + esc(S.name) + '"></label>' +
    '<label>Telefon raqamingiz<input name="phone" type="tel" inputmode="tel" required maxlength="20" placeholder="90 123 45 67" value="' + esc(S.phone) + '"></label>' +
    '<p class="small muted" style="text-align:left;margin:4px 0 0">Raqam sertifikatni sizga bog\'lash va urinishlarni sanash uchun. Hech kimga ko\'rsatilmaydi.</p>' +
    '<label>Qayerda ishlaysiz yoki shahar <span class="muted">(ixtiyoriy)</span><input name="place" maxlength="80" placeholder="Masalan: Toshkent" value="' + esc(S.place) + '"></label>' +
    '<input class="hp" name="website" tabindex="-1" autocomplete="off">' +
    '<div class="err" id="err"></div><button class="btn p block" style="margin-top:16px" id="go">Testni boshlash →</button></form></div>' + duelCard() + cta();
  bindDuelCard();
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var f = e.target; var b = document.getElementById('go');
    S.name = f.name.value.trim(); S.place = f.place.value.trim(); S.phone = f.phone.value.trim();
    if (S.name.length < 2) return showErr('Ismingizni yozing');
    if (S.phone.replace(/\D/g, '').length < 9) return showErr('Telefon raqamingizni yozing');
    b.disabled = true;
    api('POST', '/api/public/test', { name: S.name, place: S.place, phone: S.phone, website: f.website.value }).then(function (r) {
      S.key = r.key; S.attempt = r.attempt || 1; S.questions = r.questions; S.i = 0; S.answers = {}; question();
    }).catch(function (err) { b.disabled = false; showErr(err.message); });
  };
}

function question() {
  var x = S.questions[S.i];
  var chosen = S.answers[x.id];
  var n = Object.keys(S.answers).length;
  var last = S.i + 1 === S.questions.length;
  app.innerHTML = '<div class="card"><div class="qn">Savol ' + (S.i + 1) + ' / ' + S.questions.length + '</div>' +
    '<div class="bar"><i style="width:' + (n / S.questions.length * 100) + '%"></i></div>' +
    '<div class="q">' + esc(x.q) + '</div>' +
    x.a.map(function (o, k) { return '<button class="opt' + (chosen === o.i ? ' sel' : '') + '" data-o="' + o.i + '"><b>' + 'ABCDEF'[k] + ')</b> ' + esc(o.text) + '</button>'; }).join('') +
    '<div class="err" id="err"></div><div class="row">' + (S.i > 0 ? '<button class="btn" id="prev" style="flex:0 0 64px">←</button>' : '') +
    (last ? '<button class="btn g" id="fin"' + (n < S.questions.length ? ' disabled' : '') + '>✓ Yakunlash</button>'
      : '<button class="btn p" id="next"' + (chosen === undefined ? ' disabled' : '') + '>Keyingi savol →</button>') + '</div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('[data-o]'), function (b) {
    b.onclick = function () { S.answers[x.id] = Number(b.getAttribute('data-o')); question(); };
  });
  var nx = document.getElementById('next'); if (nx) nx.onclick = function () { S.i++; question(); window.scrollTo(0, 0); };
  var pv = document.getElementById('prev'); if (pv) pv.onclick = function () { S.i--; question(); };
  var fin = document.getElementById('fin');
  if (fin) fin.onclick = function () {
    fin.disabled = true;
    api('POST', '/api/public/test/finish', { key: S.key, answers: S.answers }).then(function (r) { S.result = r; result(); window.scrollTo(0, 0); })
      .catch(function (err) { fin.disabled = false; showErr(err.message); });
  };
}

function result() {
  var R = S.result;
  var wrong = R.results.filter(function (x) { return !x.ok; });
  app.innerHTML = '<div class="card hero"><div class="big">' + (R.passed ? '🎓' : '📚') + '</div>' +
    '<h2>' + (R.passed ? 'Tabriklaymiz, ' + esc(R.name) + '! Testdan o\'tdingiz' : 'Bu safar o\'tmadi, ' + esc(R.name)) + '</h2>' +
    '<div class="score ' + (R.passed ? 'ok' : 'bad') + '">' + R.pct + '%</div><p>To\'g\'ri javoblar: <b>' + R.score + ' / ' + R.total + '</b> · <b>' + R.attempt + '-urinish</b></p>' +
    (R.weak.length ? '<p class="small muted">Ko\'proq takrorlang: <b>' + R.weak.map(esc).join(', ') + '</b></p>' : '') +
    '<div class="row">' + (R.passed ? '<button class="btn p" id="cert">🏅 Sertifikat</button>' : '') + '<button class="btn" id="again">↻ Qayta topshirish</button></div>' +
    (INFO.duel_site !== false ? '<button class="btn block" id="rduel" style="margin-top:10px">⚔️ Do\'stingizni bellashuvga chaqiring</button>' : '') +
    (R.passed ? '<p class="small muted" style="margin-top:10px">Sertifikat raqami: <b>' + esc(R.code) + '</b> · tekshirish: <a href="/test?c=' + esc(R.code) + '">' + esc(location.host) + '/test?c=' + esc(R.code) + '</a></p>' : '') +
    '</div>' +
    (wrong.length ? '<h2 style="margin:20px 0 4px">Xato javoblar</h2>' + wrong.map(function (x) {
      return '<div class="rev"><b>' + esc(x.q) + '</b>' + (x.chosen ? '<div class="dont">❌ ' + esc(x.chosen) + '</div>' : '') + '<div class="do">✅ ' + esc(x.right) + '</div>' + (x.why ? '<div class="why">💡 ' + esc(x.why) + '</div>' : '') + '</div>';
    }).join('') : '') + cta();
  var c = document.getElementById('cert');
  if (c) c.onclick = function () { openCert({ name: R.name, place: R.place, pct: R.pct, score: R.score, total: R.total, at: R.at, code: R.code, attempt: R.attempt }); };
  document.getElementById('again').onclick = function () { S.result = null; intro(); window.scrollTo(0, 0); };
  var dl = document.getElementById('rduel'); if (dl) dl.onclick = function () { duelForm('link'); };
}

function cta() {
  return '<div class="cta"><b>Choyxona yoki restoraningiz bormi?</b><p>FLOWI dasturida xodimlaringiz uchun to\'liq kurs bor: 8 modul, 32 dars, har bir xodimning natijasi boshliqqa ko\'rinadi.</p>' +
    '<a class="btn" href="/#boglanish">FLOWI bilan tanishish →</a></div>';
}

function certHtml(c) {
  return '<!doctype html><html><head><meta charset="utf-8"><title>Sertifikat — ' + esc(c.name) + '</title><style>' +
    '@page{size:A4 landscape;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#0f172a}' +
    '.c{width:297mm;height:209mm;padding:16mm;display:flex}.in{flex:1;border:3px solid #0f2130;border-radius:14px;padding:14mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}' +
    '.in:before{content:"";position:absolute;inset:5px;border:1px solid #c9a227;border-radius:10px;pointer-events:none}.brand{font-weight:900;letter-spacing:3px;font-size:18pt}.brand span{color:#2156e8}' +
    '.kind{margin-top:8mm;font-size:30pt;font-weight:800;letter-spacing:1px}.sub{color:#555;margin-top:2mm;font-size:12pt}.name{margin-top:12mm;font-size:30pt;font-weight:800;border-bottom:2px solid #c9a227;padding:0 12mm 3mm}' +
    '.txt{margin-top:8mm;font-size:13pt;line-height:1.6;max-width:200mm}.row{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:11pt;color:#333}' +
    '.score{font-size:24pt;font-weight:800;color:#16a34a}.qr{width:30mm;height:30mm}.qr svg{width:100%;height:100%}.att{display:inline-block;margin-top:4mm;background:#fff4dc;color:#8a5a10;font-weight:800;font-size:11pt;padding:1mm 4mm;border-radius:20px}' +
    '@media screen{body{background:#e9ebef;padding:20px}.c{background:#fff;margin:auto;box-shadow:0 6px 30px #0002}.p{text-align:center;margin:14px}.p button{font-size:16px;padding:10px 22px;border-radius:10px;border:0;background:#2156e8;color:#fff;cursor:pointer}}@media print{.p{display:none}}' +
    '</style></head><body><div class="p"><button onclick="print()">🖨 Chop etish / PDF</button></div><div class="c"><div class="in">' +
    '<div class="brand">FLOW<span>I</span> AKADEMIYA</div><div class="kind">SERTIFIKAT</div><div class="sub">' + (c.source === 'app' ? 'Ofitsantlik va xizmat madaniyati kursi' : 'Ofitsantlik va xizmat madaniyati testi') + '</div>' +
    '<div class="name">' + esc(c.name) + '</div>' +
    '<div class="txt">' + (c.place ? '<b>' + esc(c.place) + '</b> · ' : '') + (c.source === 'app' ? 'xizmat madaniyati, dasturxon odobi, mehmon bilan muloqot va FLOWI dasturida ishlash bo\'yicha kursni tamomladi va yakuniy testdan o\'tdi.' : 'xizmat madaniyati, dasturxon odobi, mehmon bilan muloqot, gigiena va hisob-kitob bo\'yicha testdan muvaffaqiyatli o\'tdi.') +
    (c.attempt ? '<br><span class="att">' + c.attempt + '-urinishda o\'tdi</span>' : '') + '</div>' +
    '<div class="row"><div style="text-align:left">Sana: <b>' + fmtDate(c.at) + '</b><br>Raqam: <b>' + esc(c.code) + '</b><br>Tekshirish: ' + esc(location.host) + '/test?c=' + esc(c.code) + '</div>' +
    '<div class="qr">' + qrSvg(location.origin + '/test?c=' + c.code) + '</div><div style="text-align:right">Natija<div class="score">' + c.pct + '%</div>' + c.score + '/' + c.total + ' to\'g\'ri javob</div></div>' +
    '</div></div></body></html>';
}
function qrSvg(text) {
  try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return ''; }
}
function openCert(c) {
  var w = window.open('', '_blank');
  if (!w) return alert('Brauzer yangi oynani to\'sib qo\'ydi — ruxsat bering');
  w.document.write(certHtml(c)); w.document.close();
}

// /test?c=CODE — someone checks a certificate.
function verify(code) {
  app.innerHTML = '<div class="card hero"><p class="muted">Tekshirilmoqda…</p></div>';
  api('GET', '/api/public/cert?c=' + encodeURIComponent(code)).then(function (c) {
    app.innerHTML = '<div class="card hero"><div class="big">✅</div><h1>Sertifikat haqiqiy</h1>' +
      '<p><b style="font-size:22px">' + esc(c.name) + '</b>' + (c.place || c.role ? '<br><span class="muted">' + esc([c.place, c.role].filter(Boolean).join(' · ')) + '</span>' : '') + '</p>' +
      '<div class="facts"><span>Natija: ' + c.pct + '%</span><span>' + c.score + '/' + c.total + ' to\'g\'ri</span><span>' + c.attempt + '-urinish</span><span>Sana: ' + fmtDate(c.at) + '</span><span>Raqam: ' + esc(c.code) + '</span></div>' +
      (c.history && c.history.length > 1 ? '<div class="rev" style="text-align:left"><b>Urinishlar tarixi</b>' + c.history.map(function (h, i) {
        return '<div style="display:flex;justify-content:space-between;border-top:1px solid #eef0f3;padding:6px 0;margin-top:6px"><span>' + (h.attempt || i + 1) + '-urinish · ' + fmtDate(h.at) + '</span><b class="' + (h.pct >= 70 ? 'ok' : 'bad') + '">' + h.pct + '%</b></div>';
      }).join('') + '</div>' : '') +
      '<p class="small muted" style="margin-top:12px">' + (c.source === 'app' ? 'FLOWI Akademiya kursi — ish joyida o\'qib topshirilgan.' : 'flowi.uz saytidagi ochiq test.') + ' Bu sertifikat FLOWI bazasida ro\'yxatdan o\'tgan.</p>' +
      '<div class="row"><button class="btn" id="cert">🏅 Sertifikatni ochish</button><a class="btn p" href="/test">Testni o\'zim topshiraman</a></div></div>' + cta();
    document.getElementById('cert').onclick = function () { openCert(c); };
  }).catch(function () {
    app.innerHTML = '<div class="card hero"><div class="big">❌</div><h1>Sertifikat topilmadi</h1><p class="muted">Raqamni tekshiring: <b>' + esc(code) + '</b></p><a class="btn p" href="/test">Testni topshirish</a></div>';
  });
}


// ---------- Bellashuv on the site: a random opponent, or a link for a friend ----------
var INFO = {};
var DUEL = null;
function myDuels() { try { return JSON.parse(localStorage.getItem('flowi_duels') || '[]'); } catch (e) { return []; } }
function saveDuel(code, key) { try { var l = myDuels().filter(function (x) { return x.c !== code; }); l.unshift({ c: code, k: key, t: Date.now() }); localStorage.setItem('flowi_duels', JSON.stringify(l.slice(0, 20))); } catch (e) { /* private mode */ } }
function keyOf(code) { var l = myDuels(); for (var i = 0; i < l.length; i++) if (l[i].c === code) return l[i].k; return ''; }
function duelCard() {
  if (INFO.duel_site === false) return '';
  return '<div class="card" style="margin-top:16px"><h2>⚔️ Bellashuv</h2><p class="muted small">10 ta savol, har biriga 20 soniya. Ikkalangizga bir xil savollar — ko\'p to\'g\'ri javob bergan yutadi, teng bo\'lsa tezrog\'i.</p>' +
    '<div class="row"><button class="btn p" id="drand">🎲 Tasodifiy raqib</button><button class="btn" id="dlink">🔗 Do\'stni chaqirish</button></div>' +
    '<div id="dmine"></div><div id="drating"></div></div>';
}
function bindDuelCard() {
  var r = document.getElementById('drand'); if (!r) return;
  r.onclick = function () { duelForm('random'); };
  document.getElementById('dlink').onclick = function () { duelForm('link'); };
  var mine = myDuels().slice(0, 5);
  if (mine.length) Promise.all(mine.map(function (m) { return api('GET', '/api/public/duel?c=' + m.c + '&k=' + m.k).catch(function () { return null; }); })).then(function (list) {
    var el = document.getElementById('dmine'); if (!el) return;
    var rows = list.filter(Boolean).map(function (x) {
      var st = x.status === 'done' ? (x.result === 'win' ? '<b class="ok">Yutdingiz ' + x.me.score + ':' + x.opponent.score + '</b>' : x.result === 'loss' ? '<b class="bad">Yutqazdingiz ' + x.me.score + ':' + x.opponent.score + '</b>' : '<b>Durang</b>')
        : x.status === 'expired' ? '<span class="muted">Vaqti tugadi</span>' : '<span class="muted">Raqib kutilmoqda</span>';
      return '<a class="lrow" href="/test?d=' + x.code + '"><span>' + (x.opponent ? esc(x.opponent.name) : (x.mode === 'link' ? 'Havola yuborildi' : 'Raqib qidirilmoqda')) + '</span>' + st + '</a>';
    }).join('');
    if (rows) el.innerHTML = '<h3 style="margin:16px 0 6px;text-align:left">Bellashuvlarim</h3>' + rows;
  });
  api('GET', '/api/public/rating').then(function (R) {
    var el = document.getElementById('drating'); if (!el || !R.top.length) return;
    el.innerHTML = '<h3 style="margin:16px 0 6px;text-align:left">🏆 Oyning reytingi</h3>' + R.top.slice(0, 10).map(function (x) {
      return '<div class="lrow"><span>' + (['🥇', '🥈', '🥉'][x.no - 1] || x.no + '.') + ' ' + esc(x.name) + (x.place ? ' <span class="muted small">· ' + esc(x.place) + '</span>' : '') + '</span><b>' + x.points + ' ball</b></div>';
    }).join('') + '<p class="small muted" style="margin-top:6px">G\'alaba — 3 ball, durang — 1 ball.</p>';
  }).catch(function () {});
}
function duelForm(mode, code, from) {
  app.innerHTML = '<div class="card hero"><div class="big">⚔️</div><h1>' + (code ? esc(from) + ' sizni bellashuvga chaqirdi!' : mode === 'random' ? 'Tasodifiy raqib bilan bellashuv' : 'Do\'stingizni chaqiring') + '</h1>' +
    '<p class="muted">' + (code ? 'Xuddi shu 10 ta savolga javob bering — kim ko\'proq bilarkan?' : mode === 'random' ? 'Raqib kutib turgan bo\'lsa — darhol, bo\'lmasa siz hozir yechasiz, raqib keyin. Natija shu sahifada chiqadi.' : 'Avval o\'zingiz yechasiz, keyin havolani do\'stingizga yuborasiz.') + '</p>' +
    '<form id="df"><label>Ismingiz<input name="name" required maxlength="60" placeholder="Masalan: Jasur" value="' + esc(S.name) + '"></label>' +
    '<label>Telefon raqamingiz<input name="phone" type="tel" inputmode="tel" required maxlength="20" placeholder="90 123 45 67" value="' + esc(S.phone) + '"></label>' +
    '<label>Shahar yoki ish joyi <span class="muted">(ixtiyoriy)</span><input name="place" maxlength="80" placeholder="Masalan: Toshkent" value="' + esc(S.place) + '"></label>' +
    '<p class="small muted" style="text-align:left;margin:6px 0 0">Raqibingizga faqat ismingiz va shahringiz ko\'rinadi.</p>' +
    '<div class="err" id="err"></div><button class="btn p block" style="margin-top:14px" id="dgo">Boshlash →</button></form></div>';
  document.getElementById('df').onsubmit = function (e) {
    e.preventDefault(); var f = e.target; var b = document.getElementById('dgo');
    S.name = f.name.value.trim(); S.phone = f.phone.value.trim(); S.place = f.place.value.trim();
    if (S.name.length < 2) return showErr('Ismingizni yozing');
    if (S.phone.replace(/\D/g, '').length < 9) return showErr('Telefon raqamingizni yozing');
    b.disabled = true;
    var req = code ? api('POST', '/api/public/duel/join', { code: code, name: S.name, phone: S.phone, place: S.place }) : api('POST', '/api/public/duel', { mode: mode, name: S.name, phone: S.phone, place: S.place });
    req.then(function (r) { saveDuel(r.duel.code, r.key); duelPlay(r); }).catch(function (err) { b.disabled = false; showErr(err.message); });
  };
}
function duelPlay(r) {
  DUEL = { code: r.duel.code, key: r.key, mode: r.duel.mode, opponent: r.duel.opponent, q: r.questions, i: 0, answers: {}, sec: r.duel.seconds || 20, until: 0 };
  duelQ();
}
function duelQ() {
  var D = DUEL; clearInterval(D.tm); D.until = Date.now() + D.sec * 1000;
  var draw = function () {
    var x = D.q[D.i]; var ch = D.answers[x.id]; var left = Math.max(0, Math.ceil((D.until - Date.now()) / 1000)); var last = D.i + 1 === D.q.length;
    app.innerHTML = '<div class="card"><div class="qn" style="display:flex;justify-content:space-between;gap:8px"><span>⚔️ ' + (D.opponent ? esc(S.name) + ' ✕ ' + esc(D.opponent.name) + ' · ' : '') + 'Savol ' + (D.i + 1) + ' / ' + D.q.length + '</span>' +
      '<span id="dt" style="flex:none" class="' + (left <= 5 ? 'bad' : '') + '">⏱ ' + left + '</span></div>' +
      '<div class="bar"><i id="dbar" style="width:' + (left / D.sec * 100) + '%"></i></div><div class="q">' + esc(x.q) + '</div>' +
      x.a.map(function (o, k) { return '<button class="opt' + (ch === o.i ? ' sel' : '') + '" data-o="' + o.i + '"><b>' + 'ABCDEF'[k] + ')</b> ' + esc(o.text) + '</button>'; }).join('') +
      '<div class="row"><button class="btn p" id="dn"' + (ch === undefined ? ' disabled' : '') + '>' + (last ? '✓ Yakunlash' : 'Keyingi savol →') + '</button></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-o]'), function (b) { b.onclick = function () { D.answers[x.id] = Number(b.getAttribute('data-o')); draw(); }; });
    document.getElementById('dn').onclick = next;
  };
  var next = function () { if (D.i + 1 < D.q.length) { D.i++; duelQ(); window.scrollTo(0, 0); } else finish(); };
  var finish = function () {
    clearInterval(D.tm);
    app.innerHTML = '<div class="card hero"><p class="muted">Natija hisoblanmoqda…</p></div>';
    api('POST', '/api/public/duel/answer', { code: D.code, key: D.key, answers: D.answers }).then(function (r) { DUEL = null; duelView(r.duel, r.results); })
      .catch(function (err) { app.innerHTML = '<div class="card hero"><p class="bad">' + esc(err.message) + '</p><a class="btn p" href="/test">Bosh sahifa</a></div>'; });
  };
  D.tm = setInterval(function () {
    var left = Math.max(0, Math.ceil((D.until - Date.now()) / 1000));
    var el = document.getElementById('dt'); if (el) { el.textContent = '⏱ ' + left; el.className = left <= 5 ? 'bad' : ''; }
    var bar = document.getElementById('dbar'); if (bar) bar.style.width = (left / D.sec * 100) + '%';
    if (left <= 0) next();
  }, 250);
  draw();
}
function duelView(x, wrong) {
  var sec = function (ms) { return ms == null ? '' : Math.floor(ms / 60000) + ':' + ('0' + Math.round((ms % 60000) / 1000)).slice(-2); };
  var me = x.me || {}; var op = x.opponent; var link = location.origin + '/test?d=' + x.code;
  var body;
  if (x.status === 'done') {
    body = '<div class="vs"><div class="' + (x.result === 'win' ? 'w' : '') + '">' + (x.result === 'win' ? '👑' : '&nbsp;') + '<b>Siz</b><div class="big">' + me.score + '</div><small>' + sec(me.ms) + '</small></div><i>VS</i>' +
      '<div class="' + (x.result === 'loss' ? 'w' : '') + '">' + (x.result === 'loss' ? '👑' : '&nbsp;') + '<b>' + esc(op.name) + '</b><div class="big">' + op.score + '</div><small>' + sec(op.ms) + '</small></div></div>' +
      '<h2 class="' + (x.result === 'win' ? 'ok' : x.result === 'loss' ? 'bad' : '') + '" style="margin-top:10px">' + (x.result === 'win' ? 'Siz yutdingiz! +3 ball' : x.result === 'loss' ? 'Bu safar raqib yutdi' : 'Durang! +1 ball') + '</h2>';
  } else {
    body = '<div class="big">⏳</div><h2>Javoblaringiz qabul qilindi</h2><p class="muted">' + (x.status === 'expired' ? 'Raqib vaqtida o\'ynamadi — bellashuv yopildi.' : op ? esc(op.name) + ' hali o\'ynamadi.' : x.mode === 'link' ? 'Endi havolani do\'stingizga yuboring. U o\'ynagach natija shu sahifada chiqadi.' : 'Raqib topilishi bilan u ham shu savollarga javob beradi. Natijani shu sahifada ko\'rasiz.') + '</p>' +
      (x.mode === 'link' && x.joinable ? '<div class="row"><a class="btn p" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Keling, bellashamiz! Ofitsantlik bo\'yicha 10 ta savol — kim ko\'proq biladi?') + '">✈️ Telegramda yuborish</a><button class="btn" id="dcopy">📋 Nusxalash</button></div>' : '') +
      '<button class="btn block" id="drefresh" style="margin-top:10px">↻ Natijani tekshirish</button>';
  }
  app.innerHTML = '<div class="card hero">' + body + '<div class="row"><a class="btn" href="/test">Bosh sahifa</a><button class="btn p" id="dnew">⚔️ Yangi bellashuv</button></div></div>' +
    ((wrong || []).length ? '<h2 style="margin:20px 0 4px">Xato javoblar</h2>' + wrong.map(function (w) { return '<div class="rev"><b>' + esc(w.q) + '</b>' + (w.chosen ? '<div class="dont">❌ ' + esc(w.chosen) + '</div>' : '') + '<div class="do">✅ ' + esc(w.right) + '</div>' + (w.why ? '<div class="why">💡 ' + esc(w.why) + '</div>' : '') + '</div>'; }).join('') : '') + cta();
  document.getElementById('dnew').onclick = function () { duelForm('random'); };
  var cp = document.getElementById('dcopy'); if (cp) cp.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { cp.textContent = '✓ Nusxalandi'; }).catch(function () { prompt('Havola:', link); }); };
  var rf = document.getElementById('drefresh'); if (rf) rf.onclick = function () { openDuel(x.code); };
}
// /test?d=CODE — a link: my own duel (its result), or a friend's call to join.
function openDuel(code) {
  var k = keyOf(code);
  app.innerHTML = '<div class="card hero"><p class="muted">Yuklanmoqda…</p></div>';
  api('GET', '/api/public/duel?c=' + encodeURIComponent(code) + '&k=' + k).then(function (x) {
    if (x.me) return duelView(x);
    if (x.joinable) return duelForm('join', x.code, x.from.name);
    app.innerHTML = '<div class="card hero"><div class="big">⚔️</div><h1>Bu bellashuvga qo\'shilib bo\'lmaydi</h1><p class="muted">' + (x.status === 'expired' ? 'Vaqti tugagan.' : 'Unga allaqachon boshqa odam qo\'shilgan.') + '</p><button class="btn p" id="dnew">⚔️ Yangi bellashuv</button></div>' + cta();
    document.getElementById('dnew').onclick = function () { duelForm('random'); };
  }).catch(function (err) { app.innerHTML = '<div class="card hero"><div class="big">❌</div><h1>' + esc(err.message) + '</h1><a class="btn p" href="/test">Bosh sahifa</a></div>'; });
}

function closed() {
  app.innerHTML = '<div class="card hero"><div class="big">🔒</div><h1>Test vaqtincha yopiq</h1><p class="muted">Keyinroq qayta kiring. Sertifikatni tekshirish uchun havoladagi raqamdan foydalaning.</p><a class="btn p" href="/">Bosh sahifa</a></div>' + cta();
}
var params = new URLSearchParams(location.search);
var code = params.get('c');
var dcode = params.get('d');
if (code) verify(code);
else api('GET', '/api/public/info').then(function (j) {
  INFO = j || {};
  if (dcode) return openDuel(dcode);
  if (INFO.academy_site === false) closed(); else intro();
}).catch(function () { if (dcode) openDuel(dcode); else intro(); });
</script>

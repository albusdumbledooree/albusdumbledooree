<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Baholang — FLOWI</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #0f172a; background: #f4f6f9; display: flex; flex-direction: column; }
  header { background: #0f2130; color: #fff; padding: 18px 20px; text-align: center; }
  header b { font-size: 21px; display: block; } header small { opacity: .75; }
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 18px 16px; }
  .card { background: #fff; border: 1px solid #dfe3ea; border-radius: 18px; padding: 22px 18px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { margin: 0 0 10px; color: #5b6472; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .stars button { font-size: 46px; line-height: 1; background: none; border: 0; padding: 4px; color: #d5dae0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stars button.on { color: #f5b301; }
  .word { min-height: 26px; font-weight: 700; }
  textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid #dfe3ea; border-radius: 12px; margin-top: 10px; resize: vertical; min-height: 84px; }
  textarea:focus { outline: none; border-color: #2156e8; }
  .btn { width: 100%; font: inherit; font-weight: 700; padding: 15px; border-radius: 12px; border: 0; background: #2156e8; color: #fff; margin-top: 12px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .big { font-size: 64px; line-height: 1.1; }
  .err { color: #dc2626; font-size: 14px; margin-top: 8px; min-height: 20px; }
  footer { text-align: center; color: #94a3b8; font-size: 12.5px; padding: 14px; } footer a { color: inherit; }
</style>
</head>
<body>
<header><b id="name">&nbsp;</b><small>Xizmatimizni baholang</small></header>
<main id="app"><div class="card"><p>Yuklanmoqda…</p></div></main>
<footer><a href="/">FLOWI</a> — choyxona va restoranlar uchun dastur</footer>
<script>
'use strict';
var m = /^\/r\/([a-z0-9-]+)\/(\d+-[0-9a-f]{12})/i.exec(location.pathname) || [];
var C = (m[1] || '').toLowerCase(); var K = m[2] || '';
var app = document.getElementById('app'); var stars = 0;
var WORDS = ['', 'Juda yomon', 'Yomon', "O'rtacha", 'Yaxshi', "A'lo!"];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(method, path, body) {
  return fetch(path, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.error) || 'Xatolik'); return j; }); });
}
function thanks(n) {
  app.innerHTML = '<div class="card"><div class="big">' + (n >= 4 ? '🙏' : '🤝') + '</div><h1>Rahmat!</h1><p>' + (n >= 4 ? 'Bahoyingiz uchun tashakkur. Yana kutib qolamiz!' : 'Fikringiz rahbariyatga yetkazildi. Kamchilikni tuzatamiz.') + '</p></div>';
}
function form() {
  app.innerHTML = '<div class="card"><h1>Xizmat yoqdimi?</h1><p>Yulduzchani bosing</p><div class="stars">' +
    [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-s="' + n + '" aria-label="' + n + '">★</button>'; }).join('') +
    '</div><div class="word" id="word"></div><textarea id="c" maxlength="500" placeholder="Izoh (ixtiyoriy): nima yoqdi yoki yoqmadi?"></textarea>' +
    '<div class="err" id="err"></div><button class="btn" id="go" disabled>Yuborish</button></div>';
  var paint = function () {
    Array.prototype.forEach.call(app.querySelectorAll('[data-s]'), function (b) { b.className = Number(b.getAttribute('data-s')) <= stars ? 'on' : ''; });
    document.getElementById('word').textContent = WORDS[stars]; document.getElementById('go').disabled = !stars;
  };
  Array.prototype.forEach.call(app.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { stars = Number(b.getAttribute('data-s')); paint(); }; });
  document.getElementById('go').onclick = function () {
    var b = document.getElementById('go'); b.disabled = true;
    api('POST', '/api/rate', { c: C, k: K, stars: stars, comment: document.getElementById('c').value }).then(function () { thanks(stars); })
      .catch(function (e) { b.disabled = false; document.getElementById('err').textContent = e.message; });
  };
}
api('GET', '/api/rate?c=' + encodeURIComponent(C) + '&k=' + encodeURIComponent(K)).then(function (d) {
  document.getElementById('name').textContent = d.name || '';
  document.title = 'Baholang — ' + (d.name || 'FLOWI');
  if (d.done) return thanks(d.stars);
  if (d.closed) { app.innerHTML = '<div class="card"><div class="big">⌛</div><h1>Baholash muddati tugagan</h1><p>Keyingi tashrifingizda baholashingiz mumkin.</p></div>'; return; }
  form();
}).catch(function (e) { app.innerHTML = '<div class="card"><div class="big">❌</div><h1>' + esc(e.message) + '</h1></div>'; });
</script>
</body>
</html>

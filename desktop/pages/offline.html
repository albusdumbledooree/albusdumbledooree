<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http:">
<title>FLOWI — aloqa yo'q</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071726; color: #fff; font: 17px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; } p { color: #b9c4d3; margin: 0 0 6px; } small { color: #7d8ba0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #f59e0b; display: inline-block; margin-right: 8px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  button { margin-top: 22px; font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 22px; background: #2156e8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>Internet yo'q</h1>
  <p>FLOWI serveriga ulanib bo'lmadi. Aloqa tiklanishi bilan o'zi qayta ochiladi.</p>
  <p><small id="err"></small></p>
  <button id="retry">Hozir urinib ko'rish</button>
  <p style="margin-top:18px"><small>Ma'lumotlar serverda saqlanadi — hech narsa yo'qolmaydi. Sozlamalar: Ctrl+Shift+S</small></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var url = q.get('url');
  document.getElementById('err').textContent = q.get('error') || '';
  var busy = false;
  function tryOpen() {
    if (!url || busy) return;
    busy = true;
    fetch(url, { mode: 'no-cors', cache: 'no-store' }).then(function () { location.href = url; }).catch(function () { busy = false; });
  }
  document.getElementById('retry').onclick = tryOpen;
  setInterval(tryOpen, 5000);
}());
</script>
</body>
</html>

# FLOWI for Windows: builds the program on a Windows machine of GitHub and puts it on the "Releases" page:
#  - FLOWI-Setup-<version>.exe — a small web installer (under Telegram's 50 MB, so the FLOWI server sends it to the bot);
#  - FLOWI-Setup-Full-<version>.exe — the whole program in one file, nothing downloaded: for Windows 7/8, whose old
#    network part (WinINet without TLS 1.2) cannot fetch from GitHub;
#  - flowi-desktop-<version>-x64.nsis.7z / -ia32.nsis.7z — the program itself, fetched by the installer for the computer;
#  - latest.yml — what installed programs read to update themselves (…/releases/latest/download/latest.yml).
# Runs when the desktop program changes, or by hand (Actions → "FLOWI Windows dasturi" → Run workflow).
name: FLOWI Windows dasturi

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versiya
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: O'rnatish
        run: npm install --no-audit --no-fund
      - name: .exe yasash
        run: npx electron-builder --win nsis-web nsis --x64 --ia32 --publish never
      - name: Fayl (Actions sahifasida)
        uses: actions/upload-artifact@v4
        with:
          name: FLOWI-Setup-${{ steps.v.outputs.version }}
          path: |
            desktop/dist/FLOWI-Setup-Full-*.exe
            desktop/dist/nsis-web/*.exe
            desktop/dist/nsis-web/*.7z
            desktop/dist/nsis-web/latest.yml
          if-no-files-found: error
      - name: Releases sahifasiga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: FLOWI Windows ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            FLOWI — kassa kompyuteri uchun dastur (Windows 7/8/10/11, 32 va 64-bit).
            Windows 10/11: FLOWI-Setup-${{ steps.v.outputs.version }}.exe (kichik, dasturni o'zi yuklab oladi).
            Windows 7/8: FLOWI-Setup-Full-${{ steps.v.outputs.version }}.exe (to'liq, internetdan hech narsa yuklamaydi).
            O'rnatilgan dastur yangi versiyani sozlamalarda ko'rsatadi.
          make_latest: true
          files: |
            desktop/dist/FLOWI-Setup-Full-*.exe
            desktop/dist/nsis-web/*.exe
            desktop/dist/nsis-web/*.7z
            desktop/dist/nsis-web/latest.yml
